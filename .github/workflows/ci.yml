name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # NOTE: setup-node's pnpm cache requires `pnpm` to already be on PATH.
          # We enable Corepack (pnpm) in the next step, so caching here would fail.

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm test

  ui:
    # Screenshot baselines in this repo are generated on macOS (e.g. *-darwin.png).
    # Run Playwright on macOS to avoid cross-platform font/rendering diffs.
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright (chromium)
        run: pnpm exec playwright install chromium

      - name: UI regression (screenshots)
        run: pnpm test:ui
